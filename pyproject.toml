[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["temp.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports, undefined names
    "I",    # import sorting
    "B",    # bugbear: likely bugs
    "UP",   # modern Python syntax
    "BLE",  # catching bare Exception
    "TRY203",  # try/except that only re-raises
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Model imports register tables on Base.metadata for autogenerate.
"alembic/env.py" = ["F401"]
# Generated by Alembic from script.py.mako.
"alembic/versions/*.py" = ["UP", "I", "E501"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import is the installed package.
known-third-party = ["alembic"]

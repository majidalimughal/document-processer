name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ai_documents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d ai_documents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tests only use TEST_DATABASE_URL; DATABASE_URL must exist and differ from it.
      DATABASE_URL: postgresql+psycopg://app_user:ci_password@localhost:5432/ai_documents
      TEST_DATABASE_URL: postgresql://app_user:ci_password@localhost:5432/ai_documents_test
      # Tests use an in-memory Celery broker, so Redis is never contacted.
      REDIS_URL: redis://localhost:6379/0
      # The AI provider is always mocked, so no real key is needed.
      ANTHROPIC_API_KEY: ci-fake-key
      ANTHROPIC_MODEL: ci-fake-model

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations to the test database
        run: alembic -x db=test upgrade head

      - name: Run tests
        run: pytest -v
